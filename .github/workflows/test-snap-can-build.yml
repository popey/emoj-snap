name: 🧪 Test snap can be built on x86_64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-yaml=6.0.1-2build2 squashfs-tools=1:4.6.1-1build1

      - name: Test recipe
        run: python3 -m unittest discover -s tests -v

      - name: Install pinned build and review tools
        run: |
          sudo snap install snapcraft --classic --revision=18514
          sudo snap install review-tools --revision=4865
          test "$(snapcraft --version)" = "snapcraft 9.0.1"

      - name: Build snap
        id: build
        run: |
          shopt -s nullglob
          BEFORE=("$GITHUB_WORKSPACE"/*.snap)
          test "${#BEFORE[@]}" -eq 0
          # ubuntu-24.04 matches core24, so build directly on the disposable
          # runner. This avoids relying on the public LXD image server, which
          # intermittently rejects GitHub-hosted runner downloads.
          sudo --preserve-env=GITHUB_WORKSPACE snapcraft pack --destructive-mode
          ARTIFACTS=("$GITHUB_WORKSPACE"/*.snap)
          test "${#ARTIFACTS[@]}" -eq 1
          SNAP="${ARTIFACTS[0]}"
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"

      - name: Repack snap for Store review
        env:
          SNAP: ${{ steps.build.outputs.snap }}
        run: |
          mkdir .snap-review-root .snap-review-output
          unsquashfs -d .snap-review-root "$SNAP"
          snapcraft pack .snap-review-root --output .snap-review-output
          REPACKED=".snap-review-output/$(basename "$SNAP")"
          test -f "$REPACKED"
          install -m 0644 "$REPACKED" "$SNAP"

      - name: Review snap
        env:
          SNAP: ${{ steps.build.outputs.snap }}
        run: review-tools.snap-review "$SNAP"

      - name: Install and smoke-test snap
        env:
          SNAP: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP"
          snap run emoj --help
          test "$(snap run emoj unicorn --limit=1)" = "🦄"
          # shellcheck disable=SC2016 -- expand $SNAP inside snap's shell.
          test "$(snap run --shell emoj -c '$SNAP/bin/node --version')" = "v22.23.1"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
