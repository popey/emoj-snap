name: 🧪 Test snap can be built on x86_64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-yaml squashfs-tools

      - name: Test recipe
        run: python3 -m unittest discover -s tests -v

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build

      - name: Repack snap for Store review
        env:
          SNAP: ${{ steps.build.outputs.snap }}
        run: |
          mkdir .snap-review-root .snap-review-output
          unsquashfs -d .snap-review-root "$SNAP"
          snapcraft pack .snap-review-root --output .snap-review-output
          REPACKED=".snap-review-output/$(basename "$SNAP")"
          test -f "$REPACKED"
          install -m 0644 "$REPACKED" "$SNAP"

      - name: Review snap
        uses: diddlesnaps/snapcraft-review-action@40554b42331cf84dab19ef98c382620427f13482 # v1.3.1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - name: Install and smoke-test snap
        env:
          SNAP: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP"
          snap run emoj --help
          test "$(snap run emoj unicorn --limit=1)" = "🦄"
          test "$(snap run --shell emoj -c '$SNAP/bin/node --version')" = "v22.23.1"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
